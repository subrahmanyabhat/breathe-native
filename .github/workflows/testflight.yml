name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Patch ExpoModulesCore xcconfig
        run: |
          FILE="ios/Pods/Target Support Files/ExpoModulesCore/ExpoModulesCore.release.xcconfig"
          if [ -f "$FILE" ] && grep -q "OTHER_SWIFT_FLAGS" "$FILE"; then
            sed -i '' '/OTHER_SWIFT_FLAGS/ s/$/ -strict-concurrency=minimal/' "$FILE"
          fi

      - name: Import Distribution Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          security create-keychain -p "ci" ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p "ci" ci.keychain
          security set-keychain-settings -t 3600 -u ci.keychain
          security list-keychains -d user -s ci.keychain ~/Library/Keychains/login.keychain-db
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k ci.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" ci.keychain
          rm /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Install Provisioning Profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_MONITOR_BASE64: ${{ secrets.PROFILE_MONITOR_BASE64 }}
          PROFILE_SHIELD_BASE64: ${{ secrets.PROFILE_SHIELD_BASE64 }}
          PROFILE_SHIELDACTION_BASE64: ${{ secrets.PROFILE_SHIELDACTION_BASE64 }}
        run: |
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$PROFILE_APP_BASE64"          | base64 --decode > "$PP_DIR/app.mobileprovision"
          echo "$PROFILE_MONITOR_BASE64"      | base64 --decode > "$PP_DIR/monitor.mobileprovision"
          echo "$PROFILE_SHIELD_BASE64"       | base64 --decode > "$PP_DIR/shield.mobileprovision"
          echo "$PROFILE_SHIELDACTION_BASE64" | base64 --decode > "$PP_DIR/shieldaction.mobileprovision"

      - name: Setup App Store Connect API Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -workspace ios/Breathe.xcworkspace \
            -scheme Breathe \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/Breathe.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=PT83LJRA65 \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>PT83LJRA65</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.breathex.app</key>
              <string>Breathe AppStore</string>
              <key>com.breathex.app.monitor</key>
              <string>BreatheMonitor AppStore</string>
              <key>com.breathex.app.shield</key>
              <string>BreatheShield AppStore</string>
              <key>com.breathex.app.shieldaction</key>
              <string>BreatheShieldAction AppStore</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ios/build/Breathe.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ios/build/IPA
          echo "IPA size: $(du -sh ios/build/IPA/Breathe.ipa | cut -f1)"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f ios/build/IPA/Breathe.ipa \
            -t ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}" \
            --output-format xml
