name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Patch ExpoModulesCore xcconfig
        run: |
          FILE="ios/Pods/Target Support Files/ExpoModulesCore/ExpoModulesCore.release.xcconfig"
          if [ -f "$FILE" ] && grep -q "OTHER_SWIFT_FLAGS" "$FILE"; then
            sed -i '' '/OTHER_SWIFT_FLAGS/ s/$/ -strict-concurrency=minimal/' "$FILE"
          fi

      - name: Import Distribution Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          security create-keychain -p "" ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p "" ci.keychain
          security set-keychain-settings -t 3600 -u ci.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ci.keychain
          rm /tmp/cert.p12

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Breathe_AppStore.mobileprovision

      - name: Archive
        run: |
          cd ios
          xcodebuild \
            -workspace Breathe.xcworkspace \
            -scheme Breathe \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Breathe.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=PT83LJRA65 \
            archive \
            -allowProvisioningUpdates \
            2>&1 | xcpretty || xcodebuild \
            -workspace Breathe.xcworkspace \
            -scheme Breathe \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Breathe.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=PT83LJRA65 \
            archive \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>PT83LJRA65</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath ios/build/Breathe.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath ios/build/IPA \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f ios/build/IPA/Breathe.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_SPECIFIC_PASSWORD" \
            --output-format xml
